name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-pyproject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/ci/validate-pyproject

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/ci/ruff

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/ci/mypy

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/setup/check-tests-exists
        id: check-tests-exists
      - uses: ./actions/ci/pytest
        if: steps.check-tests-exists.outputs.exists == 'true'

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/ci/bandit

  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/ci/pip-audit

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/setup/check-frontend-exists
        id: check-frontend-exists

      - uses: ./actions/ci/version-check
        with:
          frontend-dir-exists: ${{ steps.check-frontend-exists.outputs.exists }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/setup/check-frontend-exists
        id: check-frontend-exists

      - uses: ./actions/ci/frontend
        if: steps.check-frontend-exists.outputs.exists == 'true'

name: Frontend
description: Runs frontend validation checks (type-checking, linting, formatting, testing) and uploads coverage reports.

runs:
  using: composite
  steps:
    - uses: javidahmed64592/actions-template-python/actions/setup/setup-node@main

    - name: Run type checking
      run: |
        npm run type-check
        echo "✅ Type checking passed"
      working-directory: ${{ github.event.repository.name }}-frontend
      shell: bash

    - name: Run linting
      run: |
        npm run lint
        echo "✅ Linting passed"
      working-directory: ${{ github.event.repository.name }}-frontend
      shell: bash

    - name: Run formatting check
      run: |
        npm run format
        echo "✅ Formatting check passed"
      working-directory: ${{ github.event.repository.name }}-frontend
      shell: bash

    - name: Run tests
      run: |
        npm run test:coverage
        echo "✅ Tests passed"
      working-directory: ${{ github.event.repository.name }}-frontend
      shell: bash

    - name: Upload frontend coverage report
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage-report
        path: ${{ github.event.repository.name }}-frontend/coverage

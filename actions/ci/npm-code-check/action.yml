name: CI - NPM Code Check
description: Run code checks on the frontend codebase.

runs:
  using: composite
  steps:
    - name: Run type checking
      run: |
        npm run type-check
        echo "✅ Type checking passed"
      working-directory: ${{ github.event.repository.name }}-frontend
      shell: bash

    - name: Run linting
      run: |
        npm run lint
        echo "✅ Linting passed"
      working-directory: ${{ github.event.repository.name }}-frontend
      shell: bash

    - name: Run formatting check
      run: |
        npm run format
        echo "✅ Formatting check passed"
      working-directory: ${{ github.event.repository.name }}-frontend
      shell: bash

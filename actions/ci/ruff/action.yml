name: Run CI job - Ruff
description: Run Ruff linting checks on the codebase.

runs:
  using: composite
  steps:
    - uses: javidahmed64592/actions-template-python/actions/setup/install-python-dev@main

    - name: Check with ruff
      run: |
        uv run -m ruff check
        echo "✅ Linting passed"
      shell: bash

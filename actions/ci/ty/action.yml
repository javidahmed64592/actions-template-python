name: Run CI job - Ty
description: Run Ty type checking on the codebase.

runs:
  using: composite
  steps:
    - uses: javidahmed64592/actions-template-python/actions/setup/install-python-dev@main

    - name: Check with Ty
      run: |
        uv run ty check .
        echo "✅ Type checking passed"
      shell: bash

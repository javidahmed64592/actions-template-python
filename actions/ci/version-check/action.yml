name: Run CI job - Version Check
description: Check version consistency across pyproject.toml and uv.lock.

inputs:
  frontend-dir-exists:
    description: 'Indicates whether the frontend directory exists. Example: true or false'
    required: true

runs:
  using: composite
  steps:
    - uses: ./actions/setup/install-python-dev@main

    - name: Check version consistency
      run: |
        # Get reference version from pyproject.toml
        REFERENCE_VERSION=$(uv run ci-pyproject-version)
        echo "Reference version (pyproject.toml): $REFERENCE_VERSION"

        MISMATCH=false

        # Check uv.lock
        LOCK_VERSION=$(uv run ci-uv-lock-version)
        if [ "$LOCK_VERSION" != "$REFERENCE_VERSION" ]; then
          echo "❌ uv.lock: $LOCK_VERSION (expected $REFERENCE_VERSION)"
          MISMATCH=true
        fi

        # Check additional versions if provided
        if [ "${{ inputs.frontend-dir-exists }}" = "true" ]; then
          # Check ${{ github.event.repository.name }}-frontend" for package.json version
          FRONTEND_VERSION=$(cat "${{ github.event.repository.name }}-frontend/package.json" | jq -r '.version')
          if [ "$FRONTEND_VERSION" != "$REFERENCE_VERSION" ]; then
            echo "❌ package.json: $FRONTEND_VERSION (expected $REFERENCE_VERSION)"
            MISMATCH=true
          fi
        fi

          if [ "$MISMATCH" = true ]; then
            echo "Version consistency check FAILED!"
            exit 1
          fi

          echo "All versions match: $REFERENCE_VERSION"
      shell: bash

name: Check Tests Exists
description: Check if the tests directory exists in the repository.

outputs:
  exists:
    description: Whether the tests directory exists
    value: ${{ steps.check-tests.outputs.exists }}

runs:
  using: composite
  steps:
    - name: Check if tests directory exists
      id: check-tests
      run: |
        if [ -d "tests" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Tests directory does not exist, skipping tests"
        fi
        echo "✅ Tests check completed"
      shell: bash
